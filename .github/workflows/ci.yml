name: CI

# Bu iş akışı, main dalına her push ve her pull request'te otomatik çalışır.
# Amaç: kodun her zaman "çalışır durumda" kalmasını garanti etmek - biri hatalı
# bir değişiklik yaparsa, GitHub bunu testler kırmadan önce yakalasın.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/backend

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: CBC solver'ı kur
        run: sudo apt-get update && sudo apt-get install -y coinor-cbc

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Testleri çalıştır
        run: pytest -v
