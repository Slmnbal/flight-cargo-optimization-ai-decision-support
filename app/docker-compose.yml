services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cargo
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cargo"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Postgres, yerel sqlite:///./cargo.db varsayılanının yerine geçiyor.
      # backend, db servisi "healthy" olana kadar (yani gerçekten bağlantı
      # kabul edene kadar, sadece süreç başlayana kadar değil) beklediği için
      # "backend Postgres hazır olmadan ayağa kalkıp bağlantı hatası verir mi"
      # sorusuyla uğraşmıyoruz.
      - DATABASE_URL=postgresql://cargo:cargo@db:5432/cargo
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      # Container içinde Vite dev sunucusu 5173'te dinliyor; host'ta 8080'e
      # yayınlıyoruz çünkü backend'in CORS allowlist'i (app/backend/app/main.py)
      # zaten localhost:8080'i tanıyor -- bu portu değiştirirsen backend'i de
      # güncellemen gerekir.
      - "8080:5173"
    environment:
      # Vite sadece VITE_ önekli env değişkenlerini client koduna (import.meta.env)
      # açıyor -- eski Streamlit'in düz "API_URL"si burada işe yaramaz. Tarayıcı
      # (container değil) backend'e istek attığı için host'ta yayınlanan port
      # kullanılıyor.
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
